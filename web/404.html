<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B1D" />
    <meta name="robots" content="noindex" />
    <title>404 — vibe.asskildt.eu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            color: #E8EEF7;
            background: linear-gradient(180deg, #070B1D 0%, #27376E 100%);
        }

        .code {
            font-size: clamp(4.5rem, 22vw, 10rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.02em;
            color: #30AABD;
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            opacity: 0.7;
            margin: 1.25rem 0 2.5rem;
        }

        .home {
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #E8EEF7;
            text-decoration: none;
            border: 1px solid rgba(232, 238, 247, 0.3);
            border-radius: 999px;
            padding: 0.75rem 1.75rem;
            transition: border-color 0.15s, background 0.15s;
        }

        .home:hover {
            border-color: #30AABD;
            background: rgba(48, 170, 189, 0.12);
        }
    </style>
</head>

<body>
    <div>
        <div class="code">404</div>
        <p class="label">Page not found</p>
        <a href="/" class="home">&larr; Back home</a>
    </div>
</body>

</html>
